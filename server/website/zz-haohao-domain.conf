# Load after haohao-speech-https.conf so the existing IP remains the default
# HTTPS server for clients without SNI. Do not add default_server here.
# Enable this final configuration only after the domain certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name haohaoime.com www.haohaoime.com;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    access_log off;
    error_log /www/wwwlogs/haohao-domain.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/haohao-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Keep this redirect inside location / so HTTP-01 challenges remain usable.
    location / {
        return 301 https://haohaoime.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.haohaoime.com;
    ssl_certificate /etc/letsencrypt/live/haohao-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haohao-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:haohao_domain_tls:1m;
    ssl_session_timeout 10m;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    access_log off;
    error_log /www/wwwlogs/haohao-domain.error.log warn;

    return 301 https://haohaoime.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name haohaoime.com;
    ssl_certificate /etc/letsencrypt/live/haohao-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haohao-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:haohao_domain_tls:1m;
    ssl_session_timeout 10m;
    server_tokens off;

    root /www/wwwroot/haohao-ime/current;
    index index.html;
    charset utf-8;
    etag on;
    gzip_static on;

    # The owner-approved friends cloud preview remains publicly downloadable,
    # but is not intended for search indexing. This is not access control.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    access_log off;
    error_log /www/wwwlogs/haohao-domain.error.log warn;

    # The original IP's speech gateway is intentionally not exposed here.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|webp)$ {
        expires 7d;
        try_files $uri =404;
    }
}
